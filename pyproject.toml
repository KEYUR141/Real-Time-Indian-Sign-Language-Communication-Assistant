[project]
name = "real-time-isl-assistant"
version = "0.1.0"
description = "MediaPipe-based isolated Indian Sign Language recognition assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.0.1",
    "numpy>=2.0,<3",
    "opencv-contrib-python>=4.10,<5",
    "scikit-learn>=1.6,<2",
    "torch>=2.5,<3",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
